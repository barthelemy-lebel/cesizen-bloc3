# ---------------------------------------------------------------------------
# CESIZen - Environnement de PRODUCTION (VPS OVHcloud, Gravelines - France)
#
# Déploiement : docker compose -f docker-compose.prod.yml --env-file .env up -d
# Aucun secret dans ce fichier : tout provient du .env déposé sur le VPS
# (chmod 600, propriétaire deploy) ou des GitHub Secrets via le workflow.
# ---------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------
  # Reverse-proxy : unique point d'entrée public, terminaison TLS
  # --------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: cesizen-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirection systématique HTTP -> HTTPS (exigence "toutes les pages en HTTPS")
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Certificats Let's Encrypt, renouvellement automatique
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--metrics.prometheus=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Socket en lecture seule : Traefik découvre les services sans pouvoir agir dessus
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/letsencrypt
      - traefik_logs:/var/log/traefik
    networks:
      - public

  # --------------------------------------------------------------------
  # API Django / DRF
  # --------------------------------------------------------------------
  backend:
    image: ghcr.io/barthelemy-lebel/cesizen-api:${IMAGE_TAG:-latest}
    container_name: cesizen-api
    restart: unless-stopped
    command:
      - gunicorn
      - cesizen.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=5                # (2 x 2 vCPU) + 1
      - --timeout=60
      - --max-requests=1000        # recyclage des workers : borne les fuites mémoire
      - --max-requests-jitter=100
      - --access-logfile=-
      - --error-logfile=-
    environment:
      DJANGO_SETTINGS_MODULE: cesizen.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      REDIS_URL: redis://redis:6379/1
      SENTRY_DSN: ${SENTRY_DSN}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    # Durcissement du conteneur applicatif
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - public      # joignable par Traefik
      - internal    # joint db et redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.routers.api.middlewares=secure-headers@file,api-ratelimit@file"

  # --------------------------------------------------------------------
  # Base de données - jamais exposée sur Internet (réseau internal only)
  # --------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: cesizen-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Force le hachage SCRAM des mots de passe applicatifs
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal      # aucun port publié : inaccessible depuis l'extérieur

  redis:
    # Cache applicatif + compteurs de rate-limiting (anti brute-force)
    image: redis:7-alpine
    container_name: cesizen-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - internal

  # --------------------------------------------------------------------
  # Sauvegardes chiffrées quotidiennes vers l'Object Storage (région FR)
  # --------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: cesizen-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      S3_BUCKET: ${S3_BUCKET}
      RETENTION_DAYS: "30"
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true       # ce réseau n'a aucune route vers Internet

volumes:
  pgdata:
  backups:
  traefik_certs:
  traefik_logs:
