# ---------------------------------------------------------------------------
# CESIZen - Déploiement en PRODUCTION
#
# Déclenchement : publication d'un tag de version (v1.2.0).
# Différence majeure avec la recette : une validation humaine est requise
# (GitHub Environment "production" avec reviewer obligatoire), conformément
# au principe de séparation entre celui qui développe et celui qui autorise
# la mise en production.
#
# INTERRUPTEUR DE DÉPLOIEMENT
# Comme pour la recette, les travaux agissant sur l'infrastructure sont
# conditionnés à la variable de dépôt DEPLOY_ENABLED. Les contrôles de
# pré-production, eux, s'exécutent toujours : ce sont eux qui refusent une
# livraison mal formée, et ils ne dépendent d'aucun serveur.
# ---------------------------------------------------------------------------
name: Déploiement Production

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:

  # ------------------------------------------------------------------
  # Garde-fou : on ne met en production que ce qui a passé la recette
  # ------------------------------------------------------------------
  controle:
    name: Contrôles pré-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que le tag pointe sur main
        run: |
          if ! git branch -r --contains "${GITHUB_SHA}" | grep -q 'origin/main'; then
            echo "Le tag ne référence pas un commit de main : livraison refusée."
            exit 1
          fi

      - name: Vérifier la présence du CHANGELOG de la version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "## \[${version}\]" CHANGELOG.md \
            || { echo "Aucune entrée CHANGELOG pour ${version}."; exit 1; }

  build:
    name: Build de l'image de production
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: controle
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cesizen-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/cesizen-api:latest
          provenance: true       # attestation de provenance (chaîne d'approvisionnement)
          sbom: true             # inventaire logiciel pour l'analyse de vulnérabilités

  deploy:
    name: Mise en production
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: build
    # Environnement protégé : GitHub bloque ce job jusqu'à approbation manuelle
    environment:
      name: production
      url: https://api.cesizen.fr

    steps:
      - name: Déploiement SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /srv/cesizen

            # Conserver la version en cours pour un rollback immédiat
            docker compose -f docker-compose.prod.yml images backend \
              --format '{{.Tag}}' > /srv/cesizen/.last_known_good

            docker compose -f docker-compose.prod.yml exec -T db \
              pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" \
              | gzip > "/srv/backups/pre-release-${{ github.ref_name }}.sql.gz"

            echo "IMAGE_TAG=${{ github.ref_name }}" > .env.image
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.image pull backend
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.image \
              run --rm backend python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.image \
              up -d --no-deps backend

      - name: Vérification post-déploiement
        id: smoke
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.cesizen.fr/api/health/)
            [ "$code" = "200" ] && { echo "Production opérationnelle."; exit 0; }
            sleep 10
          done
          exit 1

      # ----------------------------------------------------------------
      # Rollback automatique : la production ne reste jamais dégradée
      # ----------------------------------------------------------------
      - name: Retour arrière automatique
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /srv/cesizen
            echo "IMAGE_TAG=$(cat .last_known_good)" > .env.image
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.image \
              up -d --no-deps backend
            echo "Retour à la version précédente effectué."

      - name: Ouvrir un ticket d'incident en cas d'échec
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[INCIDENT] Échec de mise en production ${context.ref}`,
              labels: ['incident', 'severite:bloquant', 'priorite:critique'],
              body: `Le déploiement de \`${context.ref}\` a échoué et un retour arrière automatique a été exécuté.\n\n`
                  + `- Exécution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`
                  + `- Commit : ${context.sha}\n\n`
                  + `Traitement attendu selon le SLA « incident bloquant priorité critique » : prise en compte sous 1 h ouvrée, correction sous 3 h ouvrées.`
            });

  # --------------------------------------------------------------------
  # Mode démonstration : la séquence est déroulée sans infrastructure cible
  # --------------------------------------------------------------------
  simulation:
    name: Mise en production (mode démonstration)
    if: vars.DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    needs: controle

    steps:
      - uses: actions/checkout@v4

      - name: Valider la composition de production
        run: |
          cp deploy/.env.example /tmp/.env
          docker compose --env-file /tmp/.env \
            -f deploy/docker-compose.prod.yml config --quiet
          echo "Composition de production valide."

      - name: Vérifier le durcissement du conteneur applicatif
        run: |
          for regle in "read_only: true" "no-new-privileges:true" "cap_drop"; do
            grep -q "$regle" deploy/docker-compose.prod.yml \
              || { echo "Durcissement manquant : $regle"; exit 1; }
            echo "Présent : $regle"
          done

      - name: Séquence de mise en production qui serait exécutée
        run: |
          cat <<SEQUENCE
          Version         : ${GITHUB_REF_NAME}
          Environnement   : production (api.cesizen.fr)

            1. Contrôles pré-production           [déjà exécutés, travail « controle »]
            2. Build avec provenance et SBOM
            3. ATTENTE D'APPROBATION MANUELLE     [environnement GitHub protégé]
            4. Sauvegarde et mémorisation de la version en service
            5. Migrations puis bascule applicative
            6. Vérification de /api/health/ (12 tentatives)
            7. Si échec : retour à la version précédente + ticket d'incident

          Pour exécuter réellement cette séquence :
            - définir la variable de dépôt DEPLOY_ENABLED = true
            - renseigner les secrets PROD_HOST et PROD_SSH_KEY
            - créer l'environnement « production » avec relecteur obligatoire
          SEQUENCE

      - name: Résumé de l'exécution
        run: |
          {
            echo "### Mise en production — mode démonstration"
            echo ""
            echo "Version demandée : \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "| Contrôle | Résultat |"
            echo "|---|---|"
            echo "| Étiquette portée par main | OK (travail \`controle\`) |"
            echo "| Entrée CHANGELOG présente | OK (travail \`controle\`) |"
            echo "| Composition de production valide | OK |"
            echo "| Durcissement du conteneur | OK |"
          } >> "$GITHUB_STEP_SUMMARY"
